<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Indexador</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="/estaticos/css/estilos.css">
</head>
<body class="pagina-inicio">

  <header class="encabezado">
    <a href="/" class="logo">Indexador<span class="logo-punto">.</span></a>
    <a href="#subir" class="btn-subir" title="Subir archivos .txt" aria-label="Subir archivos .txt">
      <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 16v4h16v-4"/></svg>
    </a>
  </header>

  <main class="centro">
    $mensaje
    <h1 class="saludo">¿Qué quieres encontrar?</h1>
    <p class="subtitulo">Busca dentro de los archivos de texto que has subido.</p>

    <form action="/buscar" method="get" class="buscador" role="search">
      <svg class="icono buscador-icono" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" name="q" id="q" class="buscador-input" placeholder="Buscar en los documentos" aria-label="Buscar en los documentos" required>
      <button type="submit" class="buscador-btn" aria-label="Buscar">
        <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>

    <p class="estado-indice">$total_documentos documentos · $total_terminos términos indizados</p>
  </main>

  <div id="subir" class="modal-subir" role="dialog" aria-labelledby="titulo-subir" aria-modal="true">
    <a href="#" class="modal-fondo" aria-label="Cerrar"></a>
    <div class="modal-caja">
      <div class="modal-cabecera">
        <h2 id="titulo-subir" class="modal-titulo">Subir archivos</h2>
        <a href="#" class="modal-cerrar" aria-label="Cerrar">&times;</a>
      </div>

      <form action="/subir" method="post" enctype="multipart/form-data">
        <label for="archivos" class="zona-carga">
          <svg class="icono zona-icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M12 17v-6M9.5 13.5L12 11l2.5 2.5"/></svg>
          <span class="zona-titulo">Elige tus archivos de texto</span>
          <span class="zona-texto">Puedes seleccionar varios a la vez · solo .txt</span>
        </label>
        <input class="campo-archivo" type="file" id="archivos" name="archivos[]" accept=".txt,text/plain" multiple required>
        <p class="modal-nota">Al subirlos se guardan en el servidor y se actualiza el índice invertido.</p>
        <div class="modal-acciones">
          <a href="#" class="btn btn-claro">Cancelar</a>
          <button type="submit" class="btn btn-indexador">Subir e indizar</button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
